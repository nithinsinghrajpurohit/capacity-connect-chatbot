<!-- STEP 1: Load the widget CSS -->
<link rel="stylesheet" href="http://localhost:5000/static/chatbot-widget.css">

<!-- STEP 2: Configure API URL & Logged-In User from your website -->
<script>
  window.ASTRA_API_URL = 'http://localhost:5000';
  
  // OPTION A: Set the logged-in username directly from your website session
  window.SASTRA_USER = {
    full_name: "Sneha Patel",   // The user's name from your login session
    username: "sneha",
    role: "trainee"
  };
</script>

<!-- STEP 3: Load the widget JS (auto-initializes & auto-syncs with login) -->
<script src="http://localhost:5000/static/chatbot-widget.js"></script>
